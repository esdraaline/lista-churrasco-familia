<html lang="pt-BR">
  <head>

    <style>
      :root {
        --background: #150f0d;
        --foreground: #fff6e8;
        --muted: #d8c5ac;
        --panel: rgba(45, 33, 27, 0.9);
        --panel-strong: rgba(59, 43, 34, 0.96);
        --line: rgba(255, 246, 232, 0.14);
        --fire: #ff6a22;
        --gold: #f4bd37;
        --green: #79d46a;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--background);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 18% 0%, rgba(255, 106, 34, 0.28), transparent 30rem),
          radial-gradient(circle at 90% 8%, rgba(121, 212, 106, 0.18), transparent 24rem),
          linear-gradient(180deg, #21130f 0%, #150f0d 44%, #0f0c0b 100%);
        color: var(--foreground);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      .shell {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 18px 14px 34px;
      }

      .hero {
        position: relative;
        min-height: 360px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        border: 1px solid rgba(255, 246, 232, 0.16);
        border-radius: 28px;
        padding: 28px 22px 22px;
        background:
          linear-gradient(180deg, rgba(21, 15, 13, 0.1), rgba(21, 15, 13, 0.88)),
          repeating-linear-gradient(
            115deg,
            rgba(255, 246, 232, 0.08) 0 2px,
            transparent 2px 18px
          ),
          linear-gradient(135deg, #5e2311 0%, #251811 52%, #19321f 100%);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      }

      .hero::after {
        position: absolute;
        inset: auto -20% -35% -20%;
        height: 220px;
        background:
          radial-gradient(circle at 40% 50%, rgba(255, 106, 34, 0.62), transparent 38%),
          radial-gradient(circle at 58% 46%, rgba(244, 189, 55, 0.45), transparent 34%);
        filter: blur(14px);
        content: "";
        pointer-events: none;
      }

      .eyebrow,
      .hero h1,
      .hero p,
      .hero__stats {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        margin-bottom: 12px;
        color: #ffd9bd;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .hero h1 {
        max-width: 100%;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(40px, 13vw, 76px);
        font-weight: 800;
        line-height: 0.95;
      }

      .hero p {
        max-width: 30rem;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }

      .hero__stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 24px;
      }

      .hero__stats div {
        min-width: 0;
        border: 1px solid rgba(255, 246, 232, 0.12);
        border-radius: 16px;
        padding: 12px 10px;
        background: rgba(15, 12, 11, 0.42);
        backdrop-filter: blur(10px);
      }

      .hero__stats strong,
      .hero__stats span {
        display: block;
      }

      .hero__stats strong {
        color: #ffffff;
        font-size: 24px;
        line-height: 1;
      }

      .hero__stats span {
        margin-top: 5px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .progress-card,
      .add-form,
      .tabs-card,
      .category {
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 18px 52px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(18px);
      }

      .progress-card {
        margin-top: 14px;
        padding: 16px;
      }

      .progress-card > div:first-child {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .progress-card span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .progress-card strong {
        font-size: 14px;
      }

      .progress-track {
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 246, 232, 0.1);
      }

      .progress-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--fire), var(--gold), var(--green));
        transition: width 220ms ease;
      }

      .add-form {
        margin-top: 14px;
        padding: 16px;
      }

      .add-form label {
        display: block;
        margin-bottom: 10px;
        color: #fff2dc;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .add-form__row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 82px;
        gap: 8px;
      }

      .add-form input {
        min-width: 0;
        height: 48px;
        border: 1px solid rgba(255, 246, 232, 0.14);
        border-radius: 14px;
        outline: none;
        padding: 0 13px;
        background: rgba(15, 12, 11, 0.5);
        color: var(--foreground);
      }

      .add-form input:focus {
        border-color: rgba(255, 106, 34, 0.75);
        box-shadow: 0 0 0 3px rgba(255, 106, 34, 0.18);
      }

      .add-form input::placeholder {
        color: rgba(216, 197, 172, 0.72);
      }

      .add-form button {
        grid-column: 1 / -1;
        height: 50px;
        border: 0;
        border-radius: 15px;
        color: #1b110c;
        background: linear-gradient(135deg, var(--gold), var(--fire));
        font-weight: 900;
        cursor: pointer;
      }

      .tabs-card {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 14px;
        padding: 10px;
      }

      .tab-btn {
        min-width: 0;
        min-height: 58px;
        border: 1px solid transparent;
        border-radius: 16px;
        padding: 8px 5px;
        color: var(--muted);
        background: rgba(15, 12, 11, 0.36);
        cursor: pointer;
      }

      .tab-btn[aria-selected="true"] {
        border-color: rgba(255, 106, 34, 0.52);
        color: #fff7ea;
        background: linear-gradient(135deg, rgba(255, 106, 34, 0.22), rgba(244, 189, 55, 0.12));
      }

      .tab-emoji,
      .tab-label,
      .tab-badge {
        display: block;
      }

      .tab-emoji {
        font-size: 19px;
        line-height: 1;
      }

      .tab-label {
        margin-top: 5px;
        overflow: hidden;
        font-size: 12px;
        font-weight: 900;
        text-overflow: ellipsis;
        text-transform: none;
        white-space: nowrap;
      }

      .tab-badge {
        width: fit-content;
        min-width: 22px;
        margin: 6px auto 0;
        border-radius: 999px;
        padding: 2px 7px;
        color: #1b110c;
        background: #fff2dc;
        font-size: 11px;
        font-weight: 900;
      }

      [hidden] {
        display: none !important;
      }

      .category {
        margin-top: 14px;
        overflow: hidden;
      }

      .category__header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px;
        border-left: 5px solid var(--accent);
        background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 18%, transparent), transparent);
      }

      .category__icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        border-radius: 14px;
        background: color-mix(in srgb, var(--accent) 24%, transparent);
        font-size: 22px;
      }

      .category h2 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 22px;
        font-weight: 800;
        line-height: 1;
      }

      .category p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .items {
        display: grid;
        gap: 6px;
        padding: 10px;
      }

      .item {
        display: grid;
        grid-template-columns: 28px 30px minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 16px;
        padding: 9px 10px;
        color: var(--foreground);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .item:active,
      .item:focus-visible {
        background: var(--panel-strong);
      }

      .check {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border: 2px solid var(--accent);
        border-radius: 9px;
        color: #16100d;
        background: transparent;
        font-size: 16px;
        font-weight: 900;
      }

      .item__icon {
        font-size: 21px;
        text-align: center;
      }

      .item__name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: 16px;
        font-weight: 750;
      }

      .item__qty {
        max-width: 112px;
        overflow-wrap: anywhere;
        border-radius: 999px;
        padding: 6px 10px;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        font-size: 13px;
        font-weight: 900;
        text-align: center;
      }

      .item--checked .check {
        background: var(--accent);
      }

      .item--checked .item__name {
        color: rgba(216, 197, 172, 0.72);
        text-decoration: line-through;
        text-decoration-color: var(--accent);
        text-decoration-thickness: 2px;
      }

      .item--checked .item__qty,
      .item--checked .item__icon {
        opacity: 0.58;
      }

      .item--postponed {
        background: rgba(111, 183, 255, 0.1);
      }

      .item__action {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 1px solid rgba(255, 246, 232, 0.14);
        border-radius: 999px;
        color: #fff7ea;
        background: rgba(255, 246, 232, 0.08);
        font-size: 16px;
        cursor: pointer;
      }

      .item__action--return {
        color: #101722;
        background: #8fc8ff;
      }

      .empty-state {
        margin-top: 14px;
        border: 1px dashed var(--line);
        border-radius: 22px;
        padding: 28px 18px;
        color: var(--muted);
        background: rgba(255, 246, 232, 0.05);
        text-align: center;
      }

      .empty-state strong {
        display: block;
        margin-bottom: 6px;
        color: #ffffff;
        font-size: 18px;
      }

      .bill-panel {
        display: grid;
        gap: 14px;
        margin-top: 14px;
      }

      .bill-card {
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 16px;
        background: var(--panel);
        box-shadow: 0 18px 52px rgba(0, 0, 0, 0.2);
      }

      .bill-card h2,
      .bill-card h3 {
        margin: 0;
        color: #fff7ea;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.05;
      }

      .bill-card h2 {
        font-size: 25px;
      }

      .bill-card h3 {
        font-size: 20px;
      }

      .bill-card p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .bill-grid,
      .payer-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
        margin-top: 14px;
      }

      .bill-field {
        display: grid;
        gap: 7px;
      }

      .bill-field label {
        color: #fff2dc;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .bill-field input,
      .bill-field select {
        width: 100%;
        min-width: 0;
        height: 48px;
        border: 1px solid rgba(255, 246, 232, 0.14);
        border-radius: 14px;
        outline: none;
        padding: 0 13px;
        background: rgba(15, 12, 11, 0.5);
        color: var(--foreground);
      }

      .bill-field input:focus,
      .bill-field select:focus {
        border-color: rgba(255, 106, 34, 0.75);
        box-shadow: 0 0 0 3px rgba(255, 106, 34, 0.18);
      }

      .bill-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .bill-buttons button,
      .payer-form button,
      .settlement-copy {
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        color: #1b110c;
        background: #fff2dc;
        font-weight: 900;
        cursor: pointer;
      }

      .bill-buttons .secondary,
      .payer-form .secondary {
        border: 1px solid rgba(255, 246, 232, 0.16);
        color: var(--foreground);
        background: rgba(255, 246, 232, 0.08);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 14px;
      }

      .summary-tile {
        min-width: 0;
        border: 1px solid rgba(255, 246, 232, 0.12);
        border-radius: 16px;
        padding: 12px 8px;
        background: rgba(15, 12, 11, 0.35);
      }

      .summary-tile strong,
      .summary-tile span {
        display: block;
      }

      .summary-tile strong {
        color: #ffffff;
        font-size: 16px;
        overflow-wrap: anywhere;
      }

      .summary-tile span {
        margin-top: 5px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .payer-list,
      .settlement-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .payer-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 112px 44px;
        gap: 8px;
        align-items: center;
      }

      .payer-row input {
        min-width: 0;
        height: 46px;
        border: 1px solid rgba(255, 246, 232, 0.14);
        border-radius: 14px;
        outline: none;
        padding: 0 11px;
        background: rgba(15, 12, 11, 0.45);
        color: var(--foreground);
      }

      .payer-row button {
        width: 44px;
        height: 44px;
        border: 1px solid rgba(255, 246, 232, 0.14);
        border-radius: 999px;
        color: var(--foreground);
        background: rgba(255, 246, 232, 0.08);
        font-weight: 900;
        cursor: pointer;
      }

      .balance-row,
      .settlement-row {
        display: grid;
        gap: 4px;
        border-radius: 16px;
        padding: 12px;
        background: rgba(255, 246, 232, 0.06);
      }

      .balance-row strong,
      .settlement-row strong {
        color: #ffffff;
      }

      .balance-row span,
      .settlement-row span {
        color: var(--muted);
        font-size: 13px;
      }

      .balance-row.receive strong {
        color: #9bd85f;
      }

      .balance-row.pay strong {
        color: #ffbd8f;
      }

      .actions {
        position: sticky;
        bottom: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 18px -2px 0;
        padding: 12px 2px calc(12px + env(safe-area-inset-bottom));
        background: linear-gradient(180deg, transparent, rgba(15, 12, 11, 0.95) 24%);
      }

      .actions button {
        min-height: 50px;
        border: 0;
        border-radius: 15px;
        color: #1b110c;
        background: #fff2dc;
        font-weight: 900;
        cursor: pointer;
      }

      .actions .secondary {
        border: 1px solid rgba(255, 246, 232, 0.16);
        color: var(--foreground);
        background: rgba(255, 246, 232, 0.08);
      }

      .status {
        min-height: 20px;
        margin: 8px 4px 0;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      @media (min-width: 640px) {
        .shell {
          padding-top: 28px;
        }

        .hero {
          min-height: 420px;
          padding: 36px 34px 28px;
        }

        .add-form__row {
          grid-template-columns: minmax(0, 1fr) 110px 136px;
        }

        .add-form button {
          grid-column: auto;
        }

        .bill-grid,
        .payer-form {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }

        .payer-form button {
          align-self: end;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="eyebrow"><span aria-hidden="true">🔥</span> Churrasco de domingo</div>
        <h1 id="page-title">Lista do Churrasco</h1>
        <p>9 pessoas · 07 adultos + 02 crianças · pronta para mostrar no celular.</p>
        <div class="hero__stats" aria-label="Resumo da lista">
          <div><strong id="total-count">14</strong><span>itens</span></div>
          <div><strong id="checked-count">0</strong><span>comprados</span></div>
          <div><strong id="missing-count">14</strong><span>faltando</span></div>
        </div>
      </section>

      <section class="progress-card" aria-label="Progresso da compra">
        <div>
          <span>Progresso</span>
          <strong id="progress-label">0 de 14</strong>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </section>

      <form class="add-form shopping-only" id="add-form">
        <label for="new-product">Adicionar produto</label>
        <div class="add-form__row">
          <input id="new-product" placeholder="Ex.: pão de alho" autocomplete="off" />
          <input id="new-qty" class="qty-input" aria-label="Quantidade" placeholder="Qtd." autocomplete="off" />
          <button type="submit">Adicionar</button>
        </div>
      </form>

      <nav class="tabs-card" role="tablist" aria-label="Seções de compras">
        <button class="tab-btn" type="button" role="tab" aria-selected="true" data-tab="ativas">
          <span class="tab-emoji" aria-hidden="true">🛒</span>
          <span class="tab-label">Minhas compras</span>
          <span class="tab-badge" id="badge-ativas">14</span>
        </button>
        <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab="concluidas">
          <span class="tab-emoji" aria-hidden="true">✅</span>
          <span class="tab-label">Concluídas</span>
          <span class="tab-badge" id="badge-concluidas">0</span>
        </button>
        <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab="adiadas">
          <span class="tab-emoji" aria-hidden="true">🕒</span>
          <span class="tab-label">Adiadas</span>
          <span class="tab-badge" id="badge-adiadas">0</span>
        </button>
        <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab="conta">
          <span class="tab-emoji" aria-hidden="true">💸</span>
          <span class="tab-label">Dividir conta</span>
          <span class="tab-badge" id="badge-conta">R$</span>
        </button>
      </nav>

      <div id="categories" role="tabpanel" aria-live="polite"></div>
      <div id="bill-panel" class="bill-panel" role="tabpanel" aria-live="polite" hidden></div>

      <div class="actions shopping-only" aria-label="Ações da lista">
        <button type="button" id="share-button">Compartilhar</button>
        <button type="button" class="secondary" id="reset-button">Desmarcar concluídos</button>
      </div>

      <p class="status" id="status" role="status">
        Toque nos itens para marcar o que já foi comprado.
      </p>
    </main>

    <script>
      const storageKey = "lista-churrasco-github-pages-v2";
      const legacyStorageKey = "lista-churrasco-github-pages-v1";
      const tabStorageKey = "lista-churrasco-active-tab-v1";
      const billStorageKey = "lista-churrasco-bill-v1";
      const tabLabels = {
        ativas: "Minhas compras",
        concluidas: "Compras concluídas",
        adiadas: "Compras adiadas",
        conta: "Dividir conta",
      };

      const categories = {
        carnes: {
          title: "Carnes & Fogo",
          subtitle: "o principal da brasa",
          icon: "🥩",
          accent: "#ff6a22",
        },
        bebidas: {
          title: "Bebidas & Tempero",
          subtitle: "gelado, cítrico e certeiro",
          icon: "🍹",
          accent: "#9bd85f",
        },
        salada: {
          title: "Salada",
          subtitle: "alface e tomate já garantidos",
          icon: "🥗",
          accent: "#55b978",
        },
        sobremesa: {
          title: "Sobremesa",
          subtitle: "mousse de maracujá com chocolate",
          icon: "🍮",
          accent: "#f4bd37",
        },
        extras: {
          title: "Itens adicionados",
          subtitle: "o que a família lembrar na hora",
          icon: "➕",
          accent: "#6fb7ff",
        },
      };

      const baseItems = [
        ["contra-file", "Contra-filé", "1,5 kg", "🍖", "carnes"],
        ["cupim", "Cupim", "1,5 kg", "🍖", "carnes"],
        ["linguica", "Linguiça Perdigão", "1 kg", "🌭", "carnes"],
        ["carvao", "Carvão", "4 kg", "⚫", "carnes"],
        ["limao", "Limão", "8 un.", "🍋", "bebidas"],
        ["coca-zero", "Coca-Cola Zero", "2 L", "🥤", "bebidas"],
        ["h2oh", "H2OH", "2 L", "💧", "bebidas"],
        ["guarana", "Guaraná", "2 L", "🥤", "bebidas"],
        ["alface", "Alface", "2 pés", "🥬", "salada"],
        ["tomate", "Tomate", "5 un.", "🍅", "salada"],
        ["maracuja", "Maracujá", "4 un.", "💛", "sobremesa"],
        ["leite-condensado", "Leite condensado", "2 latas", "🥛", "sobremesa"],
        ["creme-leite", "Creme de leite", "2 latas", "🍶", "sobremesa"],
        ["chocolate-amargo", "Chocolate amargo", "200 g", "🍫", "sobremesa"],
      ].map(([id, name, qty, icon, category]) => ({
        id,
        name,
        qty,
        icon,
        category,
        checked: false,
        postponed: false,
      }));

      let items = restoreItems();
      let bill = restoreBill();
      let activeTab = localStorage.getItem(tabStorageKey) || "ativas";
      if (!tabLabels[activeTab]) activeTab = "ativas";

      function restoreItems() {
        const saved = localStorage.getItem(storageKey) || localStorage.getItem(legacyStorageKey);
        if (!saved) return [...baseItems];

        try {
          const parsed = JSON.parse(saved);
          const savedById = new Map(parsed.map((item) => [item.id, item]));
          const restoredBase = baseItems.map((item) => ({
            ...item,
            checked: savedById.get(item.id)?.checked || false,
            postponed: savedById.get(item.id)?.postponed || false,
          }));
          const extras = parsed
            .filter((item) => !baseItems.some((baseItem) => baseItem.id === item.id))
            .map((item) => ({
              ...item,
              checked: !!item.checked,
              postponed: !!item.postponed,
            }));
          return [...restoredBase, ...extras];
        } catch {
          localStorage.removeItem(storageKey);
          localStorage.removeItem(legacyStorageKey);
          return [...baseItems];
        }
      }

      function saveItems() {
        localStorage.setItem(storageKey, JSON.stringify(items));
      }

      function restoreBill() {
        const saved = localStorage.getItem(billStorageKey);
        if (!saved) {
          return {
            total: "",
            splitCount: "",
            newName: "",
            newPaid: "",
            mainPayerId: "",
            participants: [],
          };
        }

        try {
          const parsed = JSON.parse(saved);
          return {
            total: parsed.total || "",
            splitCount: parsed.splitCount || "",
            newName: "",
            newPaid: "",
            mainPayerId: parsed.mainPayerId || "",
            participants: Array.isArray(parsed.participants) ? parsed.participants : [],
          };
        } catch {
          localStorage.removeItem(billStorageKey);
          return {
            total: "",
            splitCount: "",
            newName: "",
            newPaid: "",
            mainPayerId: "",
            participants: [],
          };
        }
      }

      function saveBill() {
        localStorage.setItem(billStorageKey, JSON.stringify({
          total: bill.total,
          splitCount: bill.splitCount,
          mainPayerId: bill.mainPayerId,
          participants: bill.participants,
        }));
      }

      function parseMoney(value) {
        const clean = String(value || "")
          .replace(/[^\d,.-]/g, "")
          .trim();
        if (!clean) return 0;
        const normalized = clean.includes(",")
          ? clean.replace(/\./g, "").replace(",", ".")
          : clean;
        const number = Number.parseFloat(normalized);
        return Number.isFinite(number) ? number : 0;
      }

      function formatMoney(value) {
        return value.toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }

      function calculateBill() {
        const participants = bill.participants.map((participant, index) => ({
          ...participant,
          displayName: participant.name.trim() || `Pagante ${index + 1}`,
          paidValue: parseMoney(participant.paid),
        }));
        const paidTotal = participants.reduce((sum, participant) => sum + participant.paidValue, 0);
        const typedTotal = parseMoney(bill.total);
        const total = typedTotal > 0 ? typedTotal : paidTotal;
        const splitCount = Math.max(1, Math.round(Number.parseFloat(String(bill.splitCount).replace(",", ".")) || participants.length || 1));
        const share = total / splitCount;
        const missingPayers = Math.max(0, splitCount - participants.length);
        const balances = participants.map((participant) => ({
          ...participant,
          balance: participant.paidValue - share,
        }));
        const debtors = balances
          .filter((participant) => participant.balance < -0.005)
          .map((participant) => ({ ...participant, amount: Math.abs(participant.balance) }));
        const creditors = balances
          .filter((participant) => participant.balance > 0.005)
          .map((participant) => ({ ...participant, amount: participant.balance }));
        const settlements = [];
        let debtorIndex = 0;
        let creditorIndex = 0;

        while (debtors[debtorIndex] && creditors[creditorIndex]) {
          const amount = Math.min(debtors[debtorIndex].amount, creditors[creditorIndex].amount);
          if (amount > 0.005) {
            settlements.push({
              from: debtors[debtorIndex].displayName,
              to: creditors[creditorIndex].displayName,
              amount,
            });
          }
          debtors[debtorIndex].amount -= amount;
          creditors[creditorIndex].amount -= amount;
          if (debtors[debtorIndex].amount <= 0.005) debtorIndex += 1;
          if (creditors[creditorIndex].amount <= 0.005) creditorIndex += 1;
        }

        return {
          participants,
          paidTotal,
          typedTotal,
          total,
          splitCount,
          share,
          missingPayers,
          balances,
          settlements,
        };
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[char]);
      }

      function renderBillPanel() {
        const panel = document.querySelector("#bill-panel");
        const result = calculateBill();
        const balancesMarkup = result.balances.length === 0
          ? `<div class="empty-state"><strong>Nenhum pagante ainda</strong><span>Adicione quem participou da conta.</span></div>`
          : result.balances.map((participant) => {
              const statusClass = participant.balance > 0.005 ? "receive" : participant.balance < -0.005 ? "pay" : "";
              const statusText = participant.balance > 0.005
                ? `tem a receber ${formatMoney(participant.balance)}`
                : participant.balance < -0.005
                ? `ainda deve ${formatMoney(Math.abs(participant.balance))}`
                : "está certo na conta";
              return `
                <div class="balance-row ${statusClass}">
                  <strong>${escapeHtml(participant.displayName)}</strong>
                  <span>Pagou ${formatMoney(participant.paidValue)} · ${statusText}</span>
                </div>
              `;
            }).join("");
        const settlementsMarkup = result.settlements.length === 0
          ? `<div class="settlement-row"><strong>Nenhum acerto necessário</strong><span>Quando houver diferença, eu mostro quem paga quem.</span></div>`
          : result.settlements.map((settlement) => `
              <div class="settlement-row">
                <strong>${escapeHtml(settlement.from)} paga ${formatMoney(settlement.amount)} para ${escapeHtml(settlement.to)}</strong>
                <span>Esse pagamento equilibra a divisão.</span>
              </div>
            `).join("");

        panel.innerHTML = `
          <section class="bill-card">
            <h2>Dividir conta</h2>
            <p>Informe o total gasto e quantas pessoas ou famílias vão dividir. Se deixar o total vazio, uso a soma do que cada pagante colocou.</p>
            <div class="bill-grid">
              <div class="bill-field">
                <label for="bill-total">Valor total gasto</label>
                <input id="bill-total" inputmode="decimal" placeholder="Ex.: 340,00" value="${escapeHtml(bill.total)}" />
              </div>
              <div class="bill-field">
                <label for="bill-split-count">Quantas pessoas/famílias?</label>
                <input id="bill-split-count" inputmode="numeric" placeholder="Ex.: 3" value="${escapeHtml(bill.splitCount)}" />
              </div>
            </div>
            <div class="summary-grid" aria-label="Resumo da divisão">
              <div class="summary-tile"><strong>${formatMoney(result.total)}</strong><span>Total</span></div>
              <div class="summary-tile"><strong>${result.splitCount}</strong><span>Dividindo</span></div>
              <div class="summary-tile"><strong>${formatMoney(result.share)}</strong><span>Por pessoa</span></div>
            </div>
            <div class="bill-buttons">
              <button type="button" id="recalculate-bill">Calcular divisão</button>
              <button type="button" class="secondary" id="fill-paid-total">Usar soma dos pagamentos</button>
            </div>
            ${result.missingPayers > 0 ? `<p>Faltam ${result.missingPayers} pessoa(s)/família(s) sem nome. Elas entram na conta, mas não geram acerto nominal.</p>` : ""}
          </section>

          <section class="bill-card">
            <h3>Quem pagou</h3>
            <p>Coloque cada pagante e quanto ele já desembolsou.</p>
            <div class="payer-list">
              ${result.participants.map((participant) => `
                <div class="payer-row" data-payer-id="${escapeHtml(participant.id)}">
                  <input class="payer-name" aria-label="Nome do pagante" value="${escapeHtml(participant.name)}" placeholder="Nome" />
                  <input class="payer-paid" aria-label="Valor pago" inputmode="decimal" value="${escapeHtml(participant.paid)}" placeholder="R$ pago" />
                  <button type="button" class="payer-remove" aria-label="Remover ${escapeHtml(participant.displayName)}">×</button>
                </div>
              `).join("")}
            </div>
            <div class="payer-form">
              <div class="bill-field">
                <label for="new-payer-name">Novo pagante</label>
                <input id="new-payer-name" placeholder="Ex.: Nome" value="${escapeHtml(bill.newName)}" />
              </div>
              <div class="bill-field">
                <label for="new-payer-paid">Quanto pagou?</label>
                <input id="new-payer-paid" inputmode="decimal" placeholder="Ex.: 40,00" value="${escapeHtml(bill.newPaid)}" />
              </div>
              <button type="button" id="add-payer">Adicionar pagante</button>
              <div class="bill-field">
                <label for="main-payer-select">Quem pagou tudo?</label>
                <select id="main-payer-select">
                  <option value="">Escolha o pagante</option>
                  ${result.participants.map((participant) => `
                    <option value="${escapeHtml(participant.id)}" ${bill.mainPayerId === participant.id ? "selected" : ""}>
                      ${escapeHtml(participant.displayName)}
                    </option>
                  `).join("")}
                </select>
              </div>
              <button type="button" class="secondary" id="main-payer">Colocar total nesse pagante</button>
            </div>
          </section>

          <section class="bill-card">
            <h3>Resultado</h3>
            <p>Total pago informado: ${formatMoney(result.paidTotal)}. Cada pessoa/família deve participar com ${formatMoney(result.share)}.</p>
            <div class="settlement-list">${balancesMarkup}</div>
          </section>

          <section class="bill-card">
            <h3>Acerto sugerido</h3>
            <div class="settlement-list">${settlementsMarkup}</div>
            <div class="bill-buttons">
              <button type="button" id="copy-settlement">Copiar acerto</button>
              <button type="button" class="secondary" id="clear-bill">Limpar divisão</button>
            </div>
          </section>
        `;

        bindBillEvents();
      }

      function bindBillEvents() {
        const totalInput = document.querySelector("#bill-total");
        const splitInput = document.querySelector("#bill-split-count");
        totalInput?.addEventListener("input", (event) => {
          bill.total = event.target.value;
          saveBill();
        });
        splitInput?.addEventListener("input", (event) => {
          bill.splitCount = event.target.value;
          saveBill();
        });
        document.querySelector("#recalculate-bill")?.addEventListener("click", () => {
          renderBillPanel();
          document.querySelector("#status").textContent = "Divisão calculada.";
        });
        document.querySelector("#fill-paid-total")?.addEventListener("click", () => {
          bill.total = String(calculateBill().paidTotal.toFixed(2)).replace(".", ",");
          saveBill();
          renderBillPanel();
          document.querySelector("#status").textContent = "Total preenchido pela soma dos pagamentos.";
        });

        document.querySelectorAll(".payer-row").forEach((row) => {
          const id = row.dataset.payerId;
          row.querySelector(".payer-name").addEventListener("input", (event) => {
            bill.participants = bill.participants.map((participant) =>
              participant.id === id ? { ...participant, name: event.target.value } : participant
            );
            saveBill();
          });
          row.querySelector(".payer-paid").addEventListener("input", (event) => {
            bill.participants = bill.participants.map((participant) =>
              participant.id === id ? { ...participant, paid: event.target.value } : participant
            );
            saveBill();
          });
          row.querySelector(".payer-remove").addEventListener("click", () => {
            bill.participants = bill.participants.filter((participant) => participant.id !== id);
            if (bill.mainPayerId === id) bill.mainPayerId = "";
            saveBill();
            renderBillPanel();
          });
        });

        document.querySelector("#new-payer-name")?.addEventListener("input", (event) => {
          bill.newName = event.target.value;
        });
        document.querySelector("#new-payer-paid")?.addEventListener("input", (event) => {
          bill.newPaid = event.target.value;
        });
        document.querySelector("#main-payer-select")?.addEventListener("change", (event) => {
          bill.mainPayerId = event.target.value;
          saveBill();
        });
        document.querySelector("#add-payer")?.addEventListener("click", () => {
          const name = bill.newName.trim();
          if (!name) return;
          const newPayer = {
            id: `payer-${Date.now()}`,
            name,
            paid: bill.newPaid.trim(),
          };
          bill.participants.push(newPayer);
          if (!bill.mainPayerId) bill.mainPayerId = newPayer.id;
          bill.newName = "";
          bill.newPaid = "";
          saveBill();
          renderBillPanel();
          document.querySelector("#status").textContent = "Pagante adicionado.";
        });
        document.querySelector("#main-payer")?.addEventListener("click", () => {
          const result = calculateBill();
          if (bill.participants.length === 0) {
            document.querySelector("#status").textContent = "Adicione um pagante primeiro.";
            return;
          }
          if (!bill.mainPayerId || !bill.participants.some((participant) => participant.id === bill.mainPayerId)) {
            document.querySelector("#status").textContent = "Escolha quem pagou tudo.";
            return;
          }
          const total = result.total || result.paidTotal;
          bill.participants = bill.participants.map((participant, index) => ({
            ...participant,
            paid: participant.id === bill.mainPayerId ? String(total.toFixed(2)).replace(".", ",") : "",
          }));
          saveBill();
          renderBillPanel();
          document.querySelector("#status").textContent = "Total colocado no pagante escolhido.";
        });
        document.querySelector("#copy-settlement")?.addEventListener("click", async () => {
          const result = calculateBill();
          const lines = [
            "Divisão do churrasco:",
            `Total: ${formatMoney(result.total)}`,
            `Dividindo por: ${result.splitCount}`,
            `Cada um: ${formatMoney(result.share)}`,
            "",
            "Acerto:",
            ...(result.settlements.length
              ? result.settlements.map((settlement) => `${settlement.from} paga ${formatMoney(settlement.amount)} para ${settlement.to}`)
              : ["Nenhum acerto necessário"]),
          ];
          try {
            await navigator.clipboard.writeText(lines.join("\n"));
            document.querySelector("#status").textContent = "Acerto copiado.";
          } catch {
            document.querySelector("#status").textContent = "Não consegui copiar agora.";
          }
        });
        document.querySelector("#clear-bill")?.addEventListener("click", () => {
          bill = {
            total: "",
            splitCount: "",
            newName: "",
            newPaid: "",
            mainPayerId: "",
            participants: [],
          };
          saveBill();
          renderBillPanel();
          document.querySelector("#status").textContent = "Divisão limpa.";
        });
      }

      function render() {
        const categoryRoot = document.querySelector("#categories");
        const billPanel = document.querySelector("#bill-panel");
        categoryRoot.innerHTML = "";
        document.querySelectorAll(".tab-btn").forEach((button) => {
          button.setAttribute("aria-selected", String(button.dataset.tab === activeTab));
        });
        document.querySelectorAll(".shopping-only").forEach((element) => {
          element.hidden = activeTab === "conta";
        });
        categoryRoot.hidden = activeTab === "conta";
        billPanel.hidden = activeTab !== "conta";

        if (activeTab === "conta") {
          renderBillPanel();
          updateProgress();
          return;
        }

        const visibleItems = items.filter((item) => {
          if (activeTab === "concluidas") return item.checked;
          if (activeTab === "adiadas") return item.postponed;
          return !item.checked && !item.postponed;
        });

        if (visibleItems.length === 0) {
          const emptyMessages = {
            ativas: ["Tudo resolvido!", "Não há compras ativas agora."],
            concluidas: ["Nenhuma compra concluída", "Marque itens em Minhas compras para eles aparecerem aqui."],
            adiadas: ["Nenhuma compra adiada", "Use o botão 🕒 para mandar um item para adiadas."],
          };
          const [title, text] = emptyMessages[activeTab];
          categoryRoot.innerHTML = `
            <div class="empty-state">
              <strong>${title}</strong>
              <span>${text}</span>
            </div>
          `;
          updateProgress();
          return;
        }

        Object.entries(categories).forEach(([categoryId, category]) => {
          const categoryItems = visibleItems.filter((item) => item.category === categoryId);
          if (categoryItems.length === 0) return;

          const section = document.createElement("section");
          section.className = "category";
          section.style.setProperty("--accent", category.accent);
          section.innerHTML = `
            <header class="category__header">
              <div class="category__icon">${category.icon}</div>
              <div>
                <h2>${category.title}</h2>
                <p>${category.subtitle}</p>
              </div>
            </header>
            <div class="items">
              ${categoryItems.map((item) => `
                <button
                  class="item ${item.checked ? "item--checked" : ""} ${item.postponed ? "item--postponed" : ""}"
                  type="button"
                  aria-pressed="${item.checked}"
                  data-id="${escapeHtml(item.id)}"
                  data-item-action="${activeTab === "adiadas" ? "unpostpone" : "toggle"}"
                >
                  <span class="check" aria-hidden="true">${item.checked ? "✓" : ""}</span>
                  <span class="item__icon" aria-hidden="true">${item.icon}</span>
                  <span class="item__name">${escapeHtml(item.name)}</span>
                  <span class="item__qty">${escapeHtml(item.qty)}</span>
                  ${
                    activeTab === "ativas"
                      ? `<span class="item__action postpone-control" data-id="${escapeHtml(item.id)}" role="button" aria-label="Adiar ${escapeHtml(item.name)}">🕒</span>`
                      : activeTab === "adiadas"
                      ? `<span class="item__action item__action--return return-control" data-id="${escapeHtml(item.id)}" role="button" aria-label="Trazer ${escapeHtml(item.name)} de volta">↩</span>`
                      : `<span aria-hidden="true"></span>`
                  }
                </button>
              `).join("")}
            </div>
          `;

          categoryRoot.appendChild(section);
        });

        document.querySelectorAll(".item").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.dataset.itemAction === "unpostpone") {
              unpostponeItem(button.dataset.id);
              return;
            }
            toggleItem(button.dataset.id);
          });
        });

        document.querySelectorAll(".postpone-control").forEach((control) => {
          control.addEventListener("click", (event) => {
            event.stopPropagation();
            postponeItem(control.dataset.id);
          });
        });

        document.querySelectorAll(".return-control").forEach((control) => {
          control.addEventListener("click", (event) => {
            event.stopPropagation();
            unpostponeItem(control.dataset.id);
          });
        });

        updateProgress();
      }

      function updateProgress() {
        const checked = items.filter((item) => item.checked).length;
        const postponed = items.filter((item) => item.postponed).length;
        const active = items.filter((item) => !item.checked && !item.postponed).length;
        const total = items.length;
        const missing = active + postponed;
        const progress = total ? Math.round((checked / total) * 100) : 0;

        document.querySelector("#total-count").textContent = total;
        document.querySelector("#checked-count").textContent = checked;
        document.querySelector("#missing-count").textContent = missing;
        document.querySelector("#badge-ativas").textContent = active;
        document.querySelector("#badge-concluidas").textContent = checked;
        document.querySelector("#badge-adiadas").textContent = postponed;
        document.querySelector("#badge-conta").textContent = formatMoney(calculateBill().share).replace("R$", "").trim();
        document.querySelector("#progress-label").textContent = `${checked} de ${total}`;
        document.querySelector("#progress-fill").style.width = `${progress}%`;
      }

      function toggleItem(id) {
        items = items.map((item) => {
          if (item.id !== id) return item;
          const checked = !item.checked;
          return { ...item, checked, postponed: checked ? false : item.postponed };
        });
        saveItems();
        render();
        document.querySelector("#status").textContent = activeTab === "concluidas"
          ? "Item voltou para Minhas compras."
          : "Item movido para Compras concluídas.";
      }

      function postponeItem(id) {
        items = items.map((item) =>
          item.id === id ? { ...item, checked: false, postponed: true } : item
        );
        saveItems();
        render();
        document.querySelector("#status").textContent = "Item adiado.";
      }

      function unpostponeItem(id) {
        items = items.map((item) =>
          item.id === id ? { ...item, checked: false, postponed: false } : item
        );
        saveItems();
        activeTab = "ativas";
        localStorage.setItem(tabStorageKey, activeTab);
        render();
        document.querySelector("#status").textContent = "Item voltou para Minhas compras.";
      }

      document.querySelector("#add-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const nameInput = document.querySelector("#new-product");
        const qtyInput = document.querySelector("#new-qty");
        const name = nameInput.value.trim();
        if (!name) return;

        items.push({
          id: `extra-${Date.now()}`,
          name,
          qty: qtyInput.value.trim() || "a combinar",
          icon: "🛒",
          category: "extras",
          checked: false,
          postponed: false,
        });

        nameInput.value = "";
        qtyInput.value = "";
        saveItems();
        activeTab = "ativas";
        localStorage.setItem(tabStorageKey, activeTab);
        render();
        document.querySelector("#status").textContent = "Item adicionado.";
      });

      document.querySelector("#reset-button").addEventListener("click", () => {
        const hasChecked = items.some((item) => item.checked);
        if (!hasChecked) {
          document.querySelector("#status").textContent = "Não há compras concluídas para desmarcar.";
          return;
        }
        items = items.map((item) => ({ ...item, checked: false }));
        saveItems();
        activeTab = "ativas";
        localStorage.setItem(tabStorageKey, activeTab);
        render();
        document.querySelector("#status").textContent = "Compras concluídas voltaram para Minhas compras.";
      });

      document.querySelectorAll(".tab-btn").forEach((button) => {
        button.addEventListener("click", () => {
          activeTab = button.dataset.tab;
          localStorage.setItem(tabStorageKey, activeTab);
          render();
          document.querySelector("#status").textContent = tabLabels[activeTab];
        });
      });

      document.querySelector("#share-button").addEventListener("click", async () => {
        const text = [
          "Lista do churrasco:",
          ...items.map((item) => `${item.checked ? "✓" : "□"} ${item.name} - ${item.qty}`),
        ].join("\n");

        try {
          if (navigator.share) {
            await navigator.share({ title: "Lista do Churrasco", text, url: location.href });
            document.querySelector("#status").textContent = "Lista compartilhada.";
            return;
          }

          await navigator.clipboard.writeText(`${text}\n${location.href}`);
          document.querySelector("#status").textContent = "Lista copiada.";
        } catch {
          document.querySelector("#status").textContent = "Não consegui compartilhar agora.";
        }
      });

      render();
    </script>
  </body>
</html>
